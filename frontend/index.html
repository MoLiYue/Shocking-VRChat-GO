<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>Shocking VRChat</title>
  <!-- Apply the theme and paint the background before CSS/JS load (no flash) -->
  <script>
    (function () {
      var p = localStorage.getItem('theme') || 'dark'
      var t = p === 'system' ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : p
      document.documentElement.dataset.theme = t
    })()
  </script>
  <style>html,body{background:#1e1e2e;margin:0}html[data-theme=light],html[data-theme=light] body{background:#e6e9ef}</style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
